name: Claude Code Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Read-only task for Claude Code"
        required: true
        default: "Review this repository and summarize its files, risks, and recommended next steps."
        type: string
      model:
        description: "Exact Claude-compatible model ID shown in your JustWoker dashboard"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  claude-task:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Claude Code
        shell: pwsh
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run Claude Code through JustWoker
        shell: pwsh
        env:
          JUSTWOKER_API_KEY: ${{ secrets.JUSTWOKER_API_KEY }}
          MODEL_NAME: ${{ inputs.model }}
          TASK_PROMPT: ${{ inputs.task }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JUSTWOKER_API_KEY)) {
            throw "Missing JUSTWOKER_API_KEY. Add the key from https://api.justwoker.icu/dashboard/overview under Settings > Secrets and variables > Actions."
          }

          # JustWoker's Anthropic-compatible base URL omits /v1.
          $env:ANTHROPIC_BASE_URL = "https://api.justwoker.icu"
          $env:ANTHROPIC_AUTH_TOKEN = $env:JUSTWOKER_API_KEY
          Remove-Item Env:ANTHROPIC_API_KEY -ErrorAction SilentlyContinue

          $claudeArgs = @(
            "-p", $env:TASK_PROMPT,
            "--permission-mode", "plan",
            "--max-turns", "3",
            "--output-format", "text"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:MODEL_NAME)) {
            $env:ANTHROPIC_MODEL = $env:MODEL_NAME
            $claudeArgs += @("--model", $env:MODEL_NAME)
          }

          & claude @claudeArgs 2>&1 | Tee-Object -FilePath claude-output.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code exited with code $LASTEXITCODE. Verify the JustWoker key and an enabled model ID in the dashboard."
          }

      - name: Upload Claude output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-output
          path: claude-output.txt
          if-no-files-found: ignore
          retention-days: 3
