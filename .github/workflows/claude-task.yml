name: Claude Code Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Read-only task for Claude Code"
        required: true
        default: "Review this repository and summarize its files, risks, and recommended next steps."
        type: string
      base_url:
        description: "AgentRouter Anthropic-compatible base URL (do not append /v1)"
        required: true
        default: "https://co.agentrouter.org"
        type: string
      model:
        description: "Model ID enabled for your AgentRouter token"
        required: true
        default: "claude-opus-4-8"
        type: string

permissions:
  contents: read

jobs:
  claude-task:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Claude Code
        shell: pwsh
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run Claude Code through AgentRouter
        shell: pwsh
        env:
          ANTHROPIC_BASE_URL: ${{ inputs.base_url }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          MODEL_NAME: ${{ inputs.model }}
          TASK_PROMPT: ${{ inputs.task }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_BASE_URL)) {
            throw "Missing base URL. Use https://co.agentrouter.org without /v1 for the Anthropic-compatible API."
          }
          if ([string]::IsNullOrWhiteSpace($env:GATEWAY_API_KEY)) {
            throw "Missing GATEWAY_API_KEY. Add the AgentRouter token under Settings > Secrets and variables > Actions."
          }
          if ($env:ANTHROPIC_BASE_URL -match '/v1/?$') {
            throw "Incorrect Anthropic base URL: remove the trailing /v1. AgentRouter Anthropic API uses the base URL without /v1."
          }

          # AgentRouter documents both variables for Claude Code authentication.
          $env:ANTHROPIC_AUTH_TOKEN = $env:GATEWAY_API_KEY
          $env:ANTHROPIC_API_KEY = $env:GATEWAY_API_KEY

          $claudeArgs = @(
            "-p", $env:TASK_PROMPT,
            "--permission-mode", "plan",
            "--max-turns", "3",
            "--output-format", "text",
            "--model", $env:MODEL_NAME
          )

          & claude @claudeArgs 2>&1 | Tee-Object -FilePath claude-output.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code exited with code $LASTEXITCODE"
          }

      - name: Upload Claude output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-output
          path: claude-output.txt
          if-no-files-found: ignore
          retention-days: 3
