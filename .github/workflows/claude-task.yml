name: Claude Code Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Read-only task for Claude Code"
        required: true
        default: "Review this repository and summarize its files, risks, and recommended next steps."
        type: string
      model:
        description: "Optional exact model ID from your AgentRouter console"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  claude-task:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Claude Code
        shell: pwsh
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run Claude Code through AgentRouter
        shell: pwsh
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          MODEL_NAME: ${{ inputs.model }}
          TASK_PROMPT: ${{ inputs.task }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_BASE_URL)) {
            throw "Missing GATEWAY_BASE_URL secret. For AgentRouter, use https://agentrouter.org/"
          }
          if ([string]::IsNullOrWhiteSpace($env:GATEWAY_API_KEY)) {
            throw "Missing GATEWAY_API_KEY secret. Add the token from AgentRouter Console > Token."
          }

          # AgentRouter's Claude Code instructions specify both variables.
          $env:ANTHROPIC_AUTH_TOKEN = $env:GATEWAY_API_KEY
          $env:ANTHROPIC_API_KEY = $env:GATEWAY_API_KEY

          $claudeArgs = @(
            "-p", $env:TASK_PROMPT,
            "--permission-mode", "plan",
            "--max-turns", "3",
            "--output-format", "text"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:MODEL_NAME)) {
            $claudeArgs += @("--model", $env:MODEL_NAME)
          }

          & claude @claudeArgs 2>&1 | Tee-Object -FilePath claude-output.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code exited with code $LASTEXITCODE"
          }

      - name: Upload Claude output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-output
          path: claude-output.txt
          if-no-files-found: ignore
          retention-days: 3
