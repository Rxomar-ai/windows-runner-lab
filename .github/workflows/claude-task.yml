name: Claude Code Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Read-only task for Claude Code"
        required: true
        default: "Review this repository and summarize its files, risks, and recommended next steps."
        type: string
      model:
        description: "Optional model ID enabled for your Aiqana key; leave blank to use Claude Code's default"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  claude-task:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Claude Code
        shell: pwsh
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run Claude Code through Aiqana
        shell: pwsh
        env:
          AIQANA_API_KEY: ${{ secrets.AIQANA_API_KEY }}
          MODEL_NAME: ${{ inputs.model }}
          TASK_PROMPT: ${{ inputs.task }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIQANA_API_KEY)) {
            throw "Missing AIQANA_API_KEY. Add your Aiqana key under Settings > Secrets and variables > Actions."
          }

          # Claude Code appends /v1/messages itself, so use the origin only.
          $env:ANTHROPIC_BASE_URL = "https://aiqana.com"
          # Use a Bearer token for the Anthropic-compatible gateway.
          $env:ANTHROPIC_AUTH_TOKEN = $env:AIQANA_API_KEY
          Remove-Item Env:ANTHROPIC_API_KEY -ErrorAction SilentlyContinue

          $claudeArgs = @(
            "-p", $env:TASK_PROMPT,
            "--permission-mode", "plan",
            "--max-turns", "3",
            "--output-format", "text"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:MODEL_NAME)) {
            $claudeArgs += @("--model", $env:MODEL_NAME)
          }

          & claude @claudeArgs 2>&1 | Tee-Object -FilePath claude-output.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Claude Code exited with code $LASTEXITCODE. Check whether Aiqana supports Anthropic Messages API at /v1/messages and whether the model ID is enabled."
          }

      - name: Upload Claude output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-output
          path: claude-output.txt
          if-no-files-found: ignore
          retention-days: 3
